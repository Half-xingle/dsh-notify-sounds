# dsh-notify-sounds bundle patch: inserts the dual-face plugin row into a web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add dsh-notify-sounds`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (settings section + native desktop popups), while the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: notify-sounds
      name: 'dsh-notify-sounds'
